name: Web QA and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-test:
    name: Assets, production build, browser and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify design assets and build production website
        run: pnpm build
      - name: Install Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and accessibility checks against the production build
        run: pnpm test:e2e
      - name: Save verified production build
        uses: actions/upload-artifact@v4
        with:
          name: corexiumx-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the GitHub Pages base path
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm build --base "${{ steps.pages.outputs.base_path }}/"
      - name: Verify the GitHub Pages production layout and assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TEST_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm test:e2e
      - name: Upload GitHub Pages website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Save test report, axe results and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-qa-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
